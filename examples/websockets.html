<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Motor Angles Control</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f7f9fc;
      margin: 0;
      padding: 40px;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: #2c3e50;
    }

    #motors {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .motor {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      transition: transform 0.2s;
    }

    .motor:hover {
      transform: scale(1.02);
    }

    .motor label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 1.1em;
    }

    .value {
      color: #2980b9;
      margin-left: 10px;
      font-weight: bold;
      font-size: 1.2em;
    }

    input[type="range"] {
      width: 100%;
      margin-top: 10px;
      accent-color: #2980b9;
    }

    #status {
      text-align: center;
      margin-top: 30px;
      font-size: 0.9em;
      color: #666;
    }

    #status.connected {
      color: green;
    }

    #status.disconnected {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Motor Angles Control</h1>
  <div id="motors"></div>
  <div id="status" class="disconnected">Connecting to WebSocket...</div>

  <script>
    const motorCount = 6;
    const motorsDiv = document.getElementById('motors');
    const statusDiv = document.getElementById('status');

    const sliders = [];

    for (let i = 0; i < motorCount; i++) {
      const motorDiv = document.createElement('div');
      motorDiv.className = 'motor';

      const label = document.createElement('label');
      label.textContent = `Motor ${i + 1} Angle:`;

      const valueSpan = document.createElement('span');
      valueSpan.className = 'value';
      valueSpan.textContent = '0';

      const input = document.createElement('input');
      input.type = 'range';
      input.min = -120;
      input.max = 120;
      input.value = 0;

      input.addEventListener('input', () => {
        valueSpan.textContent = input.value;
        sendAngles();
      });

      sliders.push({ input, valueSpan });

      label.appendChild(valueSpan);
      motorDiv.appendChild(label);
      motorDiv.appendChild(input);
      motorsDiv.appendChild(motorDiv);
    }

    const socket = new WebSocket('ws://robot.faridrener.com:9001');
    const socket_read = new WebSocket('ws://localhost:9002');

    socket_read.addEventListener('open', () => {
      statusDiv.textContent = 'Connected';
      statusDiv.classList.remove('disconnected');
      statusDiv.classList.add('connected');
    });

    socket_read.addEventListener('close', () => {
      statusDiv.textContent = 'Disconnected';
      statusDiv.classList.remove('connected');
      statusDiv.classList.add('disconnected');
    });

    socket_read.addEventListener('error', () => {
      statusDiv.textContent = 'WebSocket error';
      statusDiv.classList.remove('connected');
      statusDiv.classList.add('disconnected');
    });

    function sendAngles() {
      const angles = sliders.map(slider => slider.input.value);
      const message = angles.join(',');
      if (socket_read.readyState === WebSocket.OPEN) {
        socket_read.send(message);
      }
    }

    socket.addEventListener('message', (event) => {
      let angles;
      try {
        angles = JSON.parse(event.data);
      } catch (err) {
        console.error('Invalid data from server:', event.data);
        return;
      }

      angles.forEach((angle, i) => {
        if (sliders[i]) {
          sliders[i].input.value = angle;
          sliders[i].valueSpan.textContent = angle;
        }
      });
      sendAngles();
    });
  </script>
</body>
</html>
